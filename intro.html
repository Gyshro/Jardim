<!DOCTYPE html><html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Introdução ao Jardim</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fef6fb;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      text-align: center;
    }.container {
  max-width: 600px;
  padding: 20px;
}

.frase {
  font-size: 24px;
  color: #5c2c57;
  opacity: 0;
  transition: opacity 1s ease-in-out;
  min-height: 80px;
}

.mostrar {
  opacity: 1;
}

.botao {
  display: none;
  margin-top: 30px;
  padding: 10px 20px;
  font-size: 18px;
  background-color: #d94fa1;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  transition: background 0.3s ease;
}

.botao:hover {
  background-color: #bf3e8d;
}

  </style>
</head>
<body>
  <div class="container">
    <div class="frase" id="frase"></div>
    <button class="botao" id="botao" onclick="location.href='index.html'">Ir para o Jardim</button>
  </div>  <script>
    const frases = [
      "Você, uma rosa perdida do seu jardim, perdida de onde seria realmente compreendida.",
      "Você Cereja, como tantas rosas entre roseiros, julgada pelo seu habitat e obrigada a florescer em tempos de tempestade, ao invés de te pedirem pra florescer em tempos de sol.",
      "Mas, existe um jardim pra rosas como você que pode ser quem você realmente é, sem ter medo de que reclamem por ser quem você realmente é.",
      "Um jardim não só de rosas, mas como um jardim em que você pode ser a maravilha que você é."
    ];

    let i = 0;
    const fraseElemento = document.getElementById("frase");
    const botao = document.getElementById("botao");

    function mostrarProximaFrase() {
      fraseElemento.classList.remove("mostrar");
      setTimeout(() => {
        fraseElemento.textContent = frases[i];
        fraseElemento.classList.add("mostrar");
        i++;
        if (i < frases.length) {
          setTimeout(mostrarProximaFrase, 4000);
        } else {
          botao.style.display = 'inline-block';
        }
      }, 1000);
    }

    window.onload = () => {
      mostrarProximaFrase();
    };
  </script></body>
</html>
